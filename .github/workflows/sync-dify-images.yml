name: Sync Dify images to ACR

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-dify-images-to-acr
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image:
          - busybox:latest
          - cr.weaviate.io/semitechnologies/weaviate:1.39.13
          - langgenius/dify-agent-backend:1.18.0
          - langgenius/dify-agent-local-sandbox:1.18.0
          - langgenius/dify-api:1.18.0
          - langgenius/dify-plugin-daemon:0.6.11-local
          - langgenius/dify-sandbox:0.2.15
          - langgenius/dify-web:1.18.0
          - nginx:latest
          - postgres:15-alpine
          - redis:6-alpine
          - ubuntu/squid:latest

    env:
      ACR_REGISTRY: ${{ vars.DIFY_ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.DIFY_ACR_NAMESPACE }}
      SOURCE_IMAGE: ${{ matrix.image }}
      IMAGE_PLATFORM: linux/amd64

    steps:
      - name: Login to ACR
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ACR_REGISTRY:?请配置 DIFY_ACR_REGISTRY}"
          : "${ACR_NAMESPACE:?请配置 DIFY_ACR_NAMESPACE}"
          : "${ACR_USERNAME:?请配置 ACR_USERNAME}"
          : "${ACR_PASSWORD:?请配置 ACR_PASSWORD}"

          printf '%s' "$ACR_PASSWORD" |
            docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" \
              --password-stdin

      - name: Pull source image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "$IMAGE_PLATFORM" "$SOURCE_IMAGE"

      - name: Push image to ACR
        shell: bash
        run: |
          set -euo pipefail

          name_tag="${SOURCE_IMAGE##*/}"

          # 已有 dify- 前缀的保持原样，其余补上前缀
          case "$name_tag" in
            dify-*) ;;
            *) name_tag="dify-$name_tag" ;;
          esac

          destination="$ACR_REGISTRY/$ACR_NAMESPACE/$name_tag"

          docker tag "$SOURCE_IMAGE" "$destination"
          docker push "$destination"

          echo "同步完成：$destination"
